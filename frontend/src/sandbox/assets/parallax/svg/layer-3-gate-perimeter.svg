<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="100%" height="100%">
  <defs>
    
    <!-- Nano Banana Pro Tactile Texture: Stone & Masonry Relief -->
    <filter id="nanoTactileStone" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" result="stoneNoise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.32 0" in="stoneNoise" result="stoneContrast" />
      <feBlend in="SourceGraphic" in2="stoneContrast" mode="multiply" result="stoneBlended" />
    </filter>

    <!-- Nano Banana Pro Tactile Texture: Organic Timber Wood Grain -->
    <filter id="nanoTactileWood" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.22" numOctaves="3" result="woodNoise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.18  0 0 0 0 0.08  0 0 0 0.28 0" in="woodNoise" result="woodGrain" />
      <feBlend in="SourceGraphic" in2="woodGrain" mode="multiply" />
    </filter>

    <!-- Nano Banana Pro Tactile Texture: Wet Cobblestone Specular Glint -->
    <filter id="nanoTactileCobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="cobbleNoise" />
      <feDiffuseLighting in="cobbleNoise" lighting-color="#FDE68A" surfaceScale="2" diffuseConstant="1.2" result="cobbleLight">
        <feDistantLight azimuth="225" elevation="50" />
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="cobbleLight" mode="multiply" />
    </filter>

    <!-- Nano Banana Pro Tactile Texture: Botanical Leaf Veins & Sheen -->
    <filter id="nanoTactileFoliage" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.08" numOctaves="2" result="leafNoise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.3  0 0 0 0 0.12  0 0 0 0.2 0" in="leafNoise" result="leafVeins" />
      <feBlend in="SourceGraphic" in2="leafVeins" mode="overlay" />
    </filter>

    <linearGradient id="gatePostGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="50%" stop-color="#6B7280" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <linearGradient id="woodSlatsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <radialGradient id="sconceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="1" />
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#D97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>
    <filter id="lanternFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

  </defs>
  
  <g id="estate-gates">
    <g id="left-boundary-fence" stroke="#18181B" stroke-width="2.5">
      <line x1="390" y1="365" x2="570" y2="365" stroke-width="5" />
      <line x1="390" y1="465" x2="570" y2="465" stroke-width="5" />
      <line x1="405" y1="365" x2="405" y2="465" />
      <line x1="425" y1="365" x2="425" y2="465" />
      <line x1="445" y1="365" x2="445" y2="465" />
      <line x1="465" y1="365" x2="465" y2="465" />
      <line x1="485" y1="365" x2="485" y2="465" />
      <line x1="505" y1="365" x2="505" y2="465" />
      <line x1="525" y1="365" x2="525" y2="465" />
      <line x1="545" y1="365" x2="545" y2="465" />
      <line x1="565" y1="365" x2="565" y2="465" />
    </g>

    <g id="center-louver-fence" stroke="#262626" stroke-width="2">
      <rect x="580" y="360" width="190" height="110" fill="none" stroke="#18181B" stroke-width="4" />
      <line x1="590" y1="360" x2="590" y2="470" />
      <line x1="605" y1="360" x2="605" y2="470" />
      <line x1="620" y1="360" x2="620" y2="470" />
      <line x1="635" y1="360" x2="635" y2="470" />
      <line x1="650" y1="360" x2="650" y2="470" />
      <line x1="665" y1="360" x2="665" y2="470" />
      <line x1="680" y1="360" x2="680" y2="470" />
      <line x1="695" y1="360" x2="695" y2="470" />
      <line x1="710" y1="360" x2="710" y2="470" />
      <line x1="725" y1="360" x2="725" y2="470" />
      <line x1="740" y1="360" x2="740" y2="470" />
      <line x1="755" y1="360" x2="755" y2="470" />
    </g>

    <rect x="770" y="350" width="30" height="135" fill="url(#gatePostGrad)" stroke="#1F2937" stroke-width="2" filter="url(#nanoTactileStone)" />
    <rect x="830" y="350" width="30" height="135" fill="url(#gatePostGrad)" stroke="#1F2937" stroke-width="2" filter="url(#nanoTactileStone)" />

    <g id="horizontal-slat-gate">
      <rect x="860" y="365" width="205" height="115" fill="url(#woodSlatsGrad)" stroke="#18181B" stroke-width="4" filter="url(#nanoTactileWood)" />
      <g stroke="#171717" stroke-width="2">
        <line x1="860" y1="377" x2="1065" y2="377" />
        <line x1="860" y1="389" x2="1065" y2="389" />
        <line x1="860" y1="401" x2="1065" y2="401" />
        <line x1="860" y1="413" x2="1065" y2="413" />
        <line x1="860" y1="425" x2="1065" y2="425" />
        <line x1="860" y1="437" x2="1065" y2="437" />
        <line x1="860" y1="449" x2="1065" y2="449" />
        <line x1="860" y1="461" x2="1065" y2="461" />
        <line x1="860" y1="473" x2="1065" y2="473" />
      </g>
    </g>

    <rect x="1065" y="350" width="35" height="135" fill="url(#gatePostGrad)" stroke="#1F2937" stroke-width="2" filter="url(#nanoTactileStone)" />
    <rect x="1100" y="375" width="100" height="100" fill="#374151" stroke="#1F2937" stroke-width="2" />
    <text x="1115" y="420" fill="#E5E7EB" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2">DAHLIA</text>

    <g id="pillar-sconces">
      <circle cx="785" cy="385" r="28" fill="url(#sconceGlow)" />
      <rect x="780" y="380" width="10" height="18" rx="2" fill="#FEF3C7" filter="url(#lanternFilter)" />
      <circle cx="845" cy="385" r="28" fill="url(#sconceGlow)" />
      <rect x="840" y="380" width="10" height="18" rx="2" fill="#FEF3C7" filter="url(#lanternFilter)" />
      <circle cx="1082" cy="385" r="28" fill="url(#sconceGlow)" />
      <rect x="1077" y="380" width="10" height="18" rx="2" fill="#FEF3C7" filter="url(#lanternFilter)" />
    </g>
  </g>

</svg>