<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="100%" height="100%">
  <defs>
    
    <!-- Nano Banana Pro Tactile Texture: Stone & Masonry Relief -->
    <filter id="nanoTactileStone" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" result="stoneNoise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.32 0" in="stoneNoise" result="stoneContrast" />
      <feBlend in="SourceGraphic" in2="stoneContrast" mode="multiply" result="stoneBlended" />
    </filter>

    <!-- Nano Banana Pro Tactile Texture: Organic Timber Wood Grain -->
    <filter id="nanoTactileWood" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.22" numOctaves="3" result="woodNoise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.18  0 0 0 0 0.08  0 0 0 0.28 0" in="woodNoise" result="woodGrain" />
      <feBlend in="SourceGraphic" in2="woodGrain" mode="multiply" />
    </filter>

    <!-- Nano Banana Pro Tactile Texture: Wet Cobblestone Specular Glint -->
    <filter id="nanoTactileCobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="cobbleNoise" />
      <feDiffuseLighting in="cobbleNoise" lighting-color="#FDE68A" surfaceScale="2" diffuseConstant="1.2" result="cobbleLight">
        <feDistantLight azimuth="225" elevation="50" />
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="cobbleLight" mode="multiply" />
    </filter>

    <!-- Nano Banana Pro Tactile Texture: Botanical Leaf Veins & Sheen -->
    <filter id="nanoTactileFoliage" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.08" numOctaves="2" result="leafNoise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.3  0 0 0 0 0.12  0 0 0 0.2 0" in="leafNoise" result="leafVeins" />
      <feBlend in="SourceGraphic" in2="leafVeins" mode="overlay" />
    </filter>

    <linearGradient id="leftVillaWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B6A68" />
      <stop offset="100%" stop-color="#4B4B49" />
    </linearGradient>
    <linearGradient id="timberSiding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="50%" stop-color="#A0522D" />
      <stop offset="100%" stop-color="#5C2E0B" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

  </defs>
  
  <g id="left-villa" opacity="0.95">
    <polygon points="40,115 390,140 380,165 30,140" fill="#252528" stroke="#1A1A1A" stroke-width="1.5" />
    <line x1="45" y1="140" x2="375" y2="165" stroke="#FDE68A" stroke-width="3" filter="url(#glowFilter)" />
    <rect x="55" y="155" width="220" height="150" fill="url(#leftVillaWall)" filter="url(#nanoTactileStone)" />
    <rect x="110" y="165" width="130" height="120" fill="url(#timberSiding)" filter="url(#nanoTactileWood)" />
    <g stroke="#3D1D04" stroke-width="1.5">
      <line x1="110" y1="180" x2="240" y2="180" />
      <line x1="110" y1="195" x2="240" y2="195" />
      <line x1="110" y1="210" x2="240" y2="210" />
      <line x1="110" y1="225" x2="240" y2="225" />
      <line x1="110" y1="240" x2="240" y2="240" />
      <line x1="110" y1="255" x2="240" y2="255" />
      <line x1="110" y1="270" x2="240" y2="270" />
    </g>
    <rect x="65" y="235" width="35" height="60" fill="#FBBF24" opacity="0.85" filter="url(#glowFilter)" />
    <rect x="65" y="235" width="35" height="60" fill="none" stroke="#1F2937" stroke-width="2" />
    <rect x="55" y="305" width="240" height="150" fill="#3B3B3D" filter="url(#nanoTactileStone)" />
  </g>

  <g id="right-villa" opacity="0.95">
    <polygon points="980,85 1360,150 1350,175 970,110" fill="#252528" stroke="#1A1A1A" stroke-width="1.5" />
    <line x1="985" y1="110" x2="1345" y2="175" stroke="#FDE68A" stroke-width="3" filter="url(#glowFilter)" />
    <rect x="990" y="140" width="340" height="160" fill="url(#leftVillaWall)" filter="url(#nanoTactileStone)" />
    <rect x="1000" y="160" width="220" height="110" fill="url(#timberSiding)" filter="url(#nanoTactileWood)" />
    <rect x="1225" y="270" width="105" height="45" fill="#67E8F9" opacity="0.35" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="990" y="300" width="340" height="160" fill="#333336" filter="url(#nanoTactileStone)" />
  </g>

</svg>